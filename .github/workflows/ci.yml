name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Charset check
        run: npm run check:charset

      - name: Lint
        run: npm run lint

      - name: Build shared package
        run: npm run build --workspace=@nlam/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build all packages
        run: npm run build
